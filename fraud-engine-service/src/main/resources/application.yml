server:
  port: 8082

spring:
  application:
    name: fraud-engine-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegisflow}
    username: ${SPRING_DATASOURCE_USERNAME:aegis}
    password: ${SPRING_DATASOURCE_PASSWORD:aegis_secret_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: aegisflow-fraud-engine-v1
      state-dir: /tmp/aegisflow-kafka-streams
      properties:
        auto.offset.reset: earliest
        commit.interval.ms: 500
        default.deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler

aegis:
  fraud:
    block-threshold: 80
    review-threshold: 60
    sliding-window-seconds: 60
    rules:
      blacklist-account:
        enabled: true
      velocity-spike:
        enabled: true
      amount-anomaly:
        enabled: true
      geo-impossible-travel:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
